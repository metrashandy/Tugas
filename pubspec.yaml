name: capsiscan
description: CapsiScan - klasifikasi jenis cabai berbasis deteksi multi-organ YOLO11 (offline di Android).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ultralytics_yolo: ^0.6.15
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/models/
