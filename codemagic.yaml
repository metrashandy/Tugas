workflows:
  capsiscan-android:
    name: CapsiScan Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Periksa model TFLite
        script: |
          if [ ! -f assets/models/model.tflite ]; then
            echo "GALAT: assets/models/model.tflite belum ada."
            exit 1
          fi
          ls -lh assets/models/
      - name: Buat folder Android jika belum ada
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name capsiscan --org id.capsiscan .
          fi
      - name: Pasang Proguard Rules untuk Mengatasi Crash WorkDatabase
        script: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class androidx.work.impl.** { *; }
          -dontwarn androidx.work.impl.**
          -keep class * extends androidx.room.RoomDatabase { *; }
          -keep class * extends androidx.work.InputMerger { *; }
          -keep class androidx.startup.** { *; }
          -keep class com.google.** { *; }
          -dontwarn com.google.**
          EOF

          if [ -f android/app/build.gradle.kts ]; then
            perl -pi -e 's|release \{|release {\n        isMinifyEnabled = false\n        isShrinkResources = false\n        proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")|' android/app/build.gradle.kts || true
          elif [ -f android/app/build.gradle ]; then
            perl -pi -e 's|release \{|release {\n        minifyEnabled false\n        shrinkResources false\n        proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"|' android/app/build.gradle || true
          fi
      - name: Konfigurasi Izin Kamera, Nama Aplikasi, dan Native Model
        script: |
          # 1. minSdk 26
          perl -pi -e 's/minSdk = flutter\.minSdkVersion/minSdk = 26/; s/minSdkVersion flutter\.minSdkVersion/minSdkVersion 26/' android/app/build.gradle* || true

          # 2. Nama Aplikasi
          M=android/app/src/main/AndroidManifest.xml
          perl -pi -e 's/android:label="[^"]*"/android:label="CapsiScan"/' $M || true

          # 3. Izin Kamera & LargeHeap
          perl -pi -e 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' $M || true
          perl -pi -e 's|<application|<application android:largeHeap="true"|' $M || true

          # 4. Salin model ke Native Assets
          mkdir -p android/app/src/main/assets
          cp assets/models/model.tflite android/app/src/main/assets/model.tflite

          # 5. Cegah kompresi TFLite
          if [ -f android/app/build.gradle.kts ]; then
            perl -pi -e 's|android \{|android {\n    androidResources {\n        noCompress.add("tflite")\n    }|' android/app/build.gradle.kts || true
          elif [ -f android/app/build.gradle ]; then
            perl -pi -e 's|android \{|android {\n    aaptOptions {\n        noCompress "tflite"\n    }|' android/app/build.gradle || true
          fi
      - name: Ambil dependensi
        script: flutter pub get
      - name: Buat ikon aplikasi
        script: dart run flutter_launcher_icons || echo "Lanjut ikon bawaan"
      - name: Bangun APK
        script: flutter build apk --release --split-per-abi --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
